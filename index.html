<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shift Calendar</title>
  <style>
    @page { size: landscape; margin: 10mm; }
    /* Tour */
    .tour-spotlight { position: fixed; z-index: 10001; border-radius: 8px; pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.72); transition: top 0.25s, left 0.25s, width 0.25s, height 0.25s; }
    .tour-card { position: fixed; z-index: 10002; width: 300px; background: var(--surface2);
      border: 1px solid var(--accent); border-radius: 10px; padding: 18px 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
    .tour-card h3 { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    .tour-card p { font-size: 13px; color: var(--text); line-height: 1.55; margin-bottom: 14px; }
    .tour-dots { display: flex; gap: 5px; margin-bottom: 12px; }
    .tour-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: background 0.2s; }
    .tour-dot.active { background: var(--accent); }
    .tour-controls { display: flex; align-items: center; gap: 8px; }
    .tour-controls .step-count { font-size: 11px; color: var(--text-muted); margin-right: auto; }
    @media print { .tour-spotlight, .tour-card { display: none !important; } }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1a1a2e; --surface: #16213e; --surface2: #0f172a;
      --border: #334155; --text: #e2e8f0; --text-muted: #94a3b8;
      --accent: #3b82f6; --danger: #ef4444; --warn: #f59e0b;
      --success: #10b981; --radius: 6px; --gap: 4px;
    }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 14px; min-height: 100vh; }

    /* Layout */
    #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .app-header { display: flex; align-items: center; gap: 8px; padding: 10px 16px;
      background: var(--surface2); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
    .app-header h1 { font-size: 16px; font-weight: 700; margin-right: auto; }
    .btn { padding: 5px 12px; border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; white-space: nowrap; }
    .btn:hover { background: var(--border); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-active { background: var(--warn); border-color: var(--warn); color: #111; }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .badge { display: inline-flex; align-items: center; justify-content: center;
      background: var(--danger); color: #fff; border-radius: 10px;
      font-size: 11px; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 4px; }
    .month-nav { display: flex; align-items: center; gap: 6px; }
    .month-nav .month-label { font-weight: 600; min-width: 140px; text-align: center; }
    .nav-btn { background: none; border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius); width: 28px; height: 28px; cursor: pointer;
      font-size: 16px; display: flex; align-items: center; justify-content: center; }
    .nav-btn:hover { background: var(--border); }

    /* Calendar body */
    .calendar-wrap { display: flex; flex: 1; overflow: hidden; }
    .calendar-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .day-headers { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--gap);
      padding: 4px 8px; flex-shrink: 0; }
    .day-header { text-align: center; font-size: 11px; color: var(--text-muted);
      font-weight: 600; padding: 4px 0; }
    .calendar-grid { flex: 1; overflow-y: auto; padding: 8px; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--gap); }
    .day-cell { background: var(--surface); border-radius: var(--radius); padding: 5px;
      min-height: 90px; cursor: pointer; border: 1px solid transparent; transition: border-color 0.1s; position: relative; }
    .day-cell:hover { border-color: var(--border); }
    .day-cell.outside { background: transparent; cursor: default; opacity: 0; pointer-events: none; }
    .day-cell.today { border-color: var(--accent) !important; }
    .day-number { font-size: 12px; font-weight: 600; color: var(--text);
      margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
    .conflict-badge { background: var(--danger); color: #fff; border-radius: 8px;
      font-size: 9px; padding: 1px 4px; }

    /* Coverage footer */
    .coverage-footer { padding: 6px 16px; background: var(--surface2); border-top: 1px solid var(--border);
      font-size: 12px; color: var(--text-muted); flex-shrink: 0; display: flex; gap: 16px; flex-wrap: wrap; }
    .cov-item .ok { color: var(--success); } .cov-item .warn { color: var(--warn); }

    /* Modals */
    #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      z-index: 100; display: flex; align-items: center; justify-content: center; }
    #modal-overlay:empty { display: none; }
    .modal { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
      width: min(540px, 95vw); max-height: 85vh; display: flex; flex-direction: column; }
    .modal-lg { width: min(640px, 95vw); }
    .modal-header { padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .modal-header h2 { font-size: 15px; }
    .modal-close { background: none; border: none; color: var(--text-muted);
      cursor: pointer; font-size: 20px; line-height: 1; padding: 0 4px; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 16px; overflow-y: auto; flex: 1; }
    .tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    .tab { padding: 8px 14px; cursor: pointer; font-size: 13px; color: var(--text-muted);
      border-bottom: 2px solid transparent; margin-bottom: -1px; background: none;
      border-top: none; border-left: none; border-right: none; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .item-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .item-row { display: flex; align-items: center; gap: 8px; background: var(--surface);
      border-radius: var(--radius); padding: 8px 10px; }
    .item-row .row-name { flex: 1; font-size: 13px; }
    .color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .add-form { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .add-form input, .add-form select {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); padding: 5px 8px; font-size: 13px; }
    .add-form input { flex: 1; min-width: 120px; }
    .color-swatch { width: 28px; height: 28px; border-radius: var(--radius);
      border: 1px solid var(--border); cursor: pointer; padding: 2px; }
    .section-label { font-size: 11px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em; margin: 12px 0 6px; }
    .empty-hint { color: var(--text-muted); font-size: 13px; padding: 4px 0; }

    /* Shift bars */
    .shift-bar { border-radius: 3px; padding: 3px 5px; margin-bottom: 2px; font-size: 11px;
      color: #fff; cursor: default; position: relative;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .shift-bar.unassigned { background: transparent !important; border: 1px dashed var(--warn);
      color: var(--warn); }
    .shift-time { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shift-members { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px; }
    .member-chip { display: inline-flex; align-items: center; gap: 2px; font-size: 10px;
      white-space: nowrap; cursor: pointer; border-radius: 3px; padding: 0 2px; }
    .member-chip:hover { background: rgba(255,255,255,0.15); }
    .member-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* Day editor */
    .shift-edit-row { display: flex; align-items: center; gap: 8px; background: var(--surface);
      border-radius: var(--radius); padding: 8px 10px; margin-bottom: 6px; }
    .shift-edit-info { flex: 1; }
    .shift-edit-time { font-weight: 600; font-size: 13px; }
    .shift-edit-sub { color: var(--text-muted); font-size: 12px; }
    .time-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .time-row label { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .time-row input[type=time] { background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); padding: 5px 8px; font-size: 13px; }
    .role-group { margin-bottom: 8px; }
    .role-group-label { font-size: 11px; color: var(--accent); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
    .member-check { display: flex; align-items: center; gap: 8px; padding: 5px 6px;
      border-radius: 4px; font-size: 13px; cursor: pointer; }
    .member-check:hover { background: var(--surface); }
    .member-check.busy { opacity: 0.4; pointer-events: none; }
    .member-check input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
    .form-divider { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px; }
    .tmpl-select { width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); padding: 6px 8px; font-size: 13px; margin-bottom: 10px; }
    /* Context menu */
    .ctx-menu { position: fixed; background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); z-index: 200; min-width: 180px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5); overflow: hidden; }
    .ctx-item { padding: 9px 14px; cursor: pointer; font-size: 13px; }
    .ctx-item:hover { background: var(--surface); }

    /* Appointment view */
    .appt-entry { border-radius: 3px; padding: 3px 5px; margin-bottom: 2px; font-size: 11px;
      background: var(--surface2); border-left: 3px solid var(--text-muted); }
    .appt-entry.conflict { border-left-color: var(--danger); background: rgba(239,68,68,0.08); }
    .appt-member-label { display: flex; align-items: center; gap: 4px; font-weight: 600; }
    .appt-note { color: var(--text-muted); font-size: 10px; margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .appt-note.conflict-note { color: var(--danger); }

    /* Conflicts panel */
    #conflicts-panel { width: 0; overflow: hidden; transition: width 0.2s ease;
      border-left: 1px solid transparent; background: var(--surface2); flex-shrink: 0; }
    #conflicts-panel.open { width: 300px; min-width: 300px; overflow-y: auto;
      border-left-color: var(--border); }
    .cp-inner { padding: 12px; min-width: 280px; }
    .cp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .cp-header strong { font-size: 13px; }
    .conflict-card { background: var(--surface); border-radius: var(--radius); padding: 10px;
      margin-bottom: 8px; border-left: 3px solid var(--danger); }
    .conflict-date { font-weight: 600; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .conflict-who { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 3px; }
    .conflict-appt-note { font-size: 12px; color: var(--text-muted); margin-bottom: 7px; }
    .swap-select { width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text); padding: 5px 8px; font-size: 12px; }
    .no-conflicts-msg { text-align: center; padding: 32px 12px; color: var(--success); font-size: 13px; }

    /* Print-only header */
    .print-header { display: none; }
    @media print {
      .print-header { display: block; font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #000; }
      .app-header .btn, .app-header .nav-btn, #conflicts-panel,
      #modal-overlay, #app-banner { display: none !important; }
      .app-header { border-bottom: 1px solid #ccc; }
      .month-label { color: #000 !important; }
      #app { height: auto; }
      .calendar-wrap { display: block; }
      .calendar-grid { overflow: visible; }
      .day-cell { break-inside: avoid; border: 1px solid #ddd !important;
        min-height: 80px; background: #fff !important; }
      .day-number { color: #000 !important; }
      .coverage-footer { display: flex; color: #555; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // ── Constants ──────────────────────────────────────────────────────
    const STORAGE_KEY = 'shift_cal_v1';
    const DB_NAME = 'shift_cal_db';
    const DB_STORE = 'kv';
    let _db = null;
    function _getDB() {
      if (_db) return Promise.resolve(_db);
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE);
        req.onsuccess = e => { _db = e.target.result; resolve(_db); };
        req.onerror = e => reject(e.target.error);
      });
    }
    const COLOR_PALETTE = [
      '#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6',
      '#06b6d4','#84cc16','#f97316','#ec4899','#14b8a6',
      '#6366f1','#a3e635','#fb923c','#e879f9','#22d3ee',
      '#4ade80','#fbbf24','#f43f5e','#818cf8','#34d399'
    ];
    const MONTH_NAMES = ['January','February','March','April','May','June',
                         'July','August','September','October','November','December'];
    const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    // ── Default State ─────────────────────────────────────────────────
    const DEFAULT_STATE = {
      members: [],
      roles: [],
      shiftTemplates: [],
      schedule: {},       // keyed by "YYYY-MM-DD"
      appointments: {},   // keyed by memberId
      settings: {
        viewYear: new Date().getFullYear(),
        viewMonth: new Date().getMonth()  // 0-indexed
      }
    };

    // ── State Management ──────────────────────────────────────────────
    let state = structuredClone(DEFAULT_STATE);

    async function loadState() {
      try {
        const db = await _getDB();
        const saved = await new Promise((resolve, reject) => {
          const req = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(STORAGE_KEY);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
        if (saved) {
          state = { ...structuredClone(DEFAULT_STATE), ...saved };
        } else {
          // one-time migration from localStorage
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              state = { ...structuredClone(DEFAULT_STATE), ...JSON.parse(raw) };
              saveState();
              localStorage.removeItem(STORAGE_KEY);
            }
          } catch {}
        }
      } catch {
        // IndexedDB unavailable — fall back to localStorage
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) state = { ...structuredClone(DEFAULT_STATE), ...JSON.parse(raw) };
        } catch {}
      }
    }

    function saveState() {
      _getDB().then(db => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(structuredClone(state), STORAGE_KEY);
      }).catch(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          if (e.name === 'QuotaExceededError') showBanner('Storage full — consider exporting or clearing old month data.', 'warn');
        }
      });
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ── Banner ────────────────────────────────────────────────────────
    function showBanner(msg, type = 'info') {
      const existing = document.getElementById('app-banner');
      if (existing) existing.remove();
      const el = document.createElement('div');
      el.id = 'app-banner';
      el.style.cssText = `position:fixed;top:0;left:0;right:0;padding:10px 16px;z-index:9999;
        background:${type==='warn'?'#92400e':'#1e3a5f'};color:#fff;font-size:13px;
        display:flex;justify-content:space-between;align-items:center;`;
      const span = document.createElement('span');
      span.textContent = msg;
      const closeBtn = document.createElement('button');
      closeBtn.textContent = '✕';
      closeBtn.style.cssText = 'background:none;border:none;color:#fff;cursor:pointer;font-size:16px;';
      closeBtn.onclick = () => el.remove();
      el.appendChild(span);
      el.appendChild(closeBtn);
      document.body.prepend(el);
    }

    // ── Utilities ─────────────────────────────────────────────────────
    function timeToMinutes(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    function rangesOverlap(s1, e1, s2, e2) {
      let start1 = timeToMinutes(s1), end1 = timeToMinutes(e1);
      let start2 = timeToMinutes(s2), end2 = timeToMinutes(e2);
      if (end1 <= start1) end1 += 1440;
      if (end2 <= start2) end2 += 1440;
      if (end1 > 1440 && start2 < start1) { start2 += 1440; end2 += 1440; }
      return start1 < end2 && start2 < end1;
    }

    function getNextColor(members) {
      return COLOR_PALETTE[members.length % COLOR_PALETTE.length];
    }

    function getDaysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    function isoDate(year, month, day) {
      return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    }

    function formatTime(t) {
      if (!t) return '';
      const [h, m] = t.split(':').map(Number);
      return `${h % 12 || 12}:${String(m).padStart(2,'0')}${h >= 12 ? 'pm' : 'am'}`;
    }

    function detectConflicts(st) {
      const { viewYear, viewMonth } = st.settings;
      const days = getDaysInMonth(viewYear, viewMonth);
      const conflicts = [];
      for (let d = 1; d <= days; d++) {
        const dateStr = isoDate(viewYear, viewMonth, d);
        for (const shift of (st.schedule[dateStr] || [])) {
          for (const memberId of shift.assignments) {
            for (const appt of (st.appointments[memberId] || []).filter(a => a.date === dateStr)) {
              const conflict = appt.allDay ||
                rangesOverlap(shift.startTime, shift.endTime, appt.startTime, appt.endTime);
              if (conflict) conflicts.push({ dateStr, shiftId: shift.id, memberId, apptId: appt.id });
            }
          }
        }
      }
      return conflicts;
    }

    function getAvailableSwaps(st, dateStr, shiftId, conflictedMemberId) {
      const shift = (st.schedule[dateStr] || []).find(s => s.id === shiftId);
      if (!shift) return [];
      const conflicted = st.members.find(m => m.id === conflictedMemberId);
      if (!conflicted) return [];
      const dayShifts = st.schedule[dateStr] || [];
      return st.members.filter(m => {
        if (m.id === conflictedMemberId) return false;
        if (shift.assignments.includes(m.id)) return false;
        if (m.roleId !== conflicted.roleId) return false;
        if (dayShifts.some(s => s.id !== shiftId && s.assignments.includes(m.id) &&
            rangesOverlap(shift.startTime, shift.endTime, s.startTime, s.endTime))) return false;
        if ((st.appointments[m.id] || []).some(a => a.date === dateStr &&
            (a.allDay || rangesOverlap(shift.startTime, shift.endTime, a.startTime, a.endTime)))) return false;
        return true;
      });
    }

    // ── Render ────────────────────────────────────────────────────────
    function computeConflictDates() {
      return new Set(detectConflicts(state).map(c => c.dateStr));
    }

    function renderCoverageFooter() {
      const { viewYear, viewMonth } = state.settings;
      const days = getDaysInMonth(viewYear, viewMonth);
      if (!state.shiftTemplates.length) return '<span>Add shift templates in ⚙ Settings to track coverage.</span>';
      return state.shiftTemplates.map(t => {
        let covered = 0;
        for (let d = 1; d <= days; d++) {
          const ds = isoDate(viewYear, viewMonth, d);
          if ((state.schedule[ds] || []).some(s => s.templateId === t.id && s.assignments.length > 0)) covered++;
        }
        return `<span class="cov-item">${t.name}: <span class="${covered===days?'ok':'warn'}">${covered}/${days}</span></span>`;
      }).join('');
    }

    function renderCalendarGrid() {
      const { viewYear, viewMonth } = state.settings;
      const days = getDaysInMonth(viewYear, viewMonth);
      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const today = new Date();
      const conflictDates = computeConflictDates();
      const allConflicts = detectConflicts(state);
      let cells = '';
      for (let i = 0; i < firstDay; i++) cells += `<div class="day-cell outside"></div>`;
      for (let d = 1; d <= days; d++) {
        const dateStr = isoDate(viewYear, viewMonth, d);
        const isToday = today.getFullYear()===viewYear && today.getMonth()===viewMonth && today.getDate()===d;
        const hasConflict = conflictDates.has(dateStr);
        const content = state._apptMode
          ? renderApptDayContent(dateStr, allConflicts)
          : renderDayShifts(dateStr);
        cells += `<div class="day-cell${isToday?' today':''}" data-date="${dateStr}"
            oncontextmenu="openCopyMenu(event,this.dataset.date)">
          <div class="day-number">${d}${hasConflict?'<span class="conflict-badge">⚠</span>':''}</div>
          ${content}
        </div>`;
      }
      return cells;
    }

    function renderDayShifts(dateStr) {
      const shifts = (state.schedule[dateStr] || [])
        .slice().sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
      return shifts.map(shift => {
        const unassigned = shift.assignments.length === 0;
        const tmplName = shift.templateId
          ? (state.shiftTemplates.find(t => t.id === shift.templateId)?.name || 'Custom') : 'Custom';
        const firstMember = !unassigned ? state.members.find(m => m.id === shift.assignments[0]) : null;
        const bgColor = firstMember ? firstMember.color + 'cc' : 'var(--surface2)';
        const chips = shift.assignments.map(mid => {
          const m = state.members.find(m => m.id === mid);
          if (!m) return '';
          return `<span class="member-chip" data-member-id="${m.id}" title="${escapeHtml(m.name)}">
            <span class="member-dot" style="background:${m.color}"></span>${escapeHtml(m.name.split(' ')[0])}
          </span>`;
        }).join('');
        return `<div class="shift-bar${unassigned?' unassigned':''}"
            style="${unassigned?'':'background:'+bgColor}" title="${escapeHtml(tmplName)}">
          <div class="shift-time">${formatTime(shift.startTime)}–${formatTime(shift.endTime)}</div>
          ${unassigned
            ? '<div style="font-size:10px;">Unassigned</div>'
            : `<div class="shift-members">${chips}</div>`}
        </div>`;
      }).join('');
    }
    function renderApptDayContent(dateStr, allConflicts) {
      const conflictKeys = new Set(
        allConflicts.filter(c => c.dateStr === dateStr).map(c => `${c.memberId}:${c.apptId}`)
      );
      const entries = [];
      state.members.forEach(m => {
        (state.appointments[m.id] || []).filter(a => a.date === dateStr).forEach(a => {
          entries.push({ m, a, isConflict: conflictKeys.has(`${m.id}:${a.id}`) });
        });
      });
      if (!entries.length) return '<span style="color:var(--text-muted);font-size:10px;">—</span>';
      return entries.map(({ m, a, isConflict }) => {
        const timeStr = a.allDay ? 'All day' : `${formatTime(a.startTime)}–${formatTime(a.endTime)}`;
        return `<div class="appt-entry${isConflict?' conflict':''}">
          <div class="appt-member-label">
            <span class="member-dot" style="background:${m.color}"></span>${escapeHtml(m.name.split(' ')[0])}
          </div>
          <div class="appt-note${isConflict?' conflict-note':''}">${escapeHtml(a.note)} · ${timeStr}${isConflict?' ⚠':''}</div>
        </div>`;
      }).join('');
    }

    function render() {
      const { viewYear, viewMonth } = state.settings;
      const conflictCount = detectConflicts(state).length;
      document.getElementById('app').innerHTML = `
        <header class="app-header">
          <div class="print-header">Shift Calendar — ${MONTH_NAMES[viewMonth]} ${viewYear}</div>
          <h1>Shift Calendar</h1>
          <div class="month-nav" id="tour-month-nav">
            <button class="nav-btn" onclick="prevMonth()">&#8249;</button>
            <span class="month-label">${MONTH_NAMES[viewMonth]} ${viewYear}</span>
            <button class="nav-btn" onclick="nextMonth()">&#8250;</button>
          </div>
          <button class="btn" onclick="goToToday()">Today</button>
          <button class="btn${state._apptMode?' btn-active':''}" onclick="toggleApptMode()" id="tour-appt-btn">
            👁 ${state._apptMode?'← Shifts':'Appointments'}
          </button>
          <button class="btn" onclick="toggleConflictsPanel()" id="tour-conflicts-btn">
            ⚠ Conflicts${conflictCount?`<span class="badge">${conflictCount}</span>`:''}
          </button>
          <button class="btn" onclick="openSettings()" id="tour-settings-btn">⚙ Settings</button>
          <button class="btn" onclick="window.print()" id="tour-print-btn">🖨</button>
          <button class="btn" onclick="startTour()" id="tour-start-btn" style="border-color:var(--accent);color:var(--accent);">? Tour</button>
        </header>
        <div class="calendar-wrap">
          <div class="calendar-main">
            <div class="day-headers">${DAY_NAMES.map(d=>`<div class="day-header">${d}</div>`).join('')}</div>
            <div class="calendar-grid">
              <div class="days-grid" id="tour-days-grid">${renderCalendarGrid()}</div>
            </div>
            <footer class="coverage-footer" id="tour-coverage-footer">${renderCoverageFooter()}</footer>
          </div>
          <div id="conflicts-panel"></div>
        </div>
        <div id="modal-overlay"></div>`;
      if (_conflictsPanelOpen) renderConflictsPanel();
    }

    // ── Navigation ────────────────────────────────────────────────────
    function prevMonth() {
      if (state.settings.viewMonth === 0) { state.settings.viewYear--; state.settings.viewMonth = 11; }
      else state.settings.viewMonth--;
      saveState(); render();
    }
    function nextMonth() {
      if (state.settings.viewMonth === 11) { state.settings.viewYear++; state.settings.viewMonth = 0; }
      else state.settings.viewMonth++;
      saveState(); render();
    }
    function goToToday() {
      state.settings.viewYear = new Date().getFullYear();
      state.settings.viewMonth = new Date().getMonth();
      saveState(); render();
    }

    // ── Stubs (replaced in later tasks) ──────────────────────────────
    let _conflictsPanelOpen = false;
    function toggleApptMode() {
      state._apptMode = !state._apptMode;
      render();
    }
    function toggleConflictsPanel() {
      _conflictsPanelOpen = !_conflictsPanelOpen;
      renderConflictsPanel();
    }
    let _dm = null;  // day modal transient state

    function openDayModal(dateStr) {
      if (state._apptMode) { openApptModal(dateStr); return; }
      _dm = { dateStr, adding: false, editId: null, templateId: '', startTime: '06:00', endTime: '14:00', assignments: [] };
      _renderDayModal();
    }

    function _renderDayModal() {
      const { dateStr } = _dm;
      const dateLabel = new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US',
        { weekday:'long', month:'long', day:'numeric', year:'numeric' });
      const shifts = (state.schedule[dateStr] || [])
        .slice().sort((a,b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));

      const existingRows = shifts.map(s => {
        const names = s.assignments.map(id => state.members.find(m=>m.id===id)?.name.split(' ')[0]).filter(Boolean).join(', ') || 'Unassigned';
        const tmpl = s.templateId ? (state.shiftTemplates.find(t=>t.id===s.templateId)?.name||'Custom') : 'Custom';
        return `<div class="shift-edit-row">
          <div class="shift-edit-info">
            <div class="shift-edit-time">${formatTime(s.startTime)}–${formatTime(s.endTime)}</div>
            <div class="shift-edit-sub">${escapeHtml(tmpl)} · ${escapeHtml(names)}</div>
          </div>
          <button class="btn" onclick="_editShift('${s.id}')">Edit</button>
          <button class="btn btn-danger" onclick="_removeShift('${s.id}')">✕</button>
        </div>`;
      }).join('');

      const formHtml = (_dm.adding || _dm.editId) ? _renderShiftForm() :
        `<button class="btn btn-primary" onclick="_dm.adding=true;_renderDayModal()">+ Add Shift</button>`;

      document.getElementById('modal-overlay').innerHTML = `
        <div class="modal modal-lg">
          <div class="modal-header">
            <h2>${dateLabel}</h2>
            <button class="modal-close" onclick="closeModal()">✕</button>
          </div>
          <div class="modal-body">
            ${existingRows || '<p class="empty-hint" style="margin-bottom:12px;">No shifts scheduled.</p>'}
            ${formHtml}
          </div>
        </div>`;
    }

    function _renderShiftForm() {
      const { templateId, startTime, endTime, assignments } = _dm;
      const tmplOpts = `<option value="">— Custom times —</option>` +
        state.shiftTemplates.map(t =>
          `<option value="${t.id}"${templateId===t.id?' selected':''}>${escapeHtml(t.name)} (${formatTime(t.startTime)}–${formatTime(t.endTime)})</option>`
        ).join('');

      const memberGroups = state.roles.map(role => {
        const roleMembers = state.members.filter(m => m.roleId === role.id);
        if (!roleMembers.length) return '';
        const checks = roleMembers.map(m => {
          const busy = (state.schedule[_dm.dateStr] || []).some(s =>
            s.id !== _dm.editId && s.assignments.includes(m.id) &&
            rangesOverlap(startTime, endTime, s.startTime, s.endTime));
          const checked = assignments.includes(m.id);
          return `<label class="member-check${busy?' busy':''}">
            <input type="checkbox" ${checked?'checked':''} ${busy?'disabled':''}
              onchange="_toggleMember('${m.id}',this.checked)">
            <span class="member-dot" style="background:${m.color}"></span>
            ${escapeHtml(m.name)}${busy?' <span style="color:var(--text-muted);font-size:11px;">(busy)</span>':''}
          </label>`;
        }).join('');
        return `<div class="role-group">
          <div class="role-group-label">${escapeHtml(role.name)}</div>
          ${checks}
        </div>`;
      }).join('');

      return `<div class="form-divider">
        <div class="section-label">${_dm.editId?'Edit Shift':'New Shift'}</div>
        <div class="section-label" style="margin-top:8px;">Template</div>
        <select class="tmpl-select" onchange="_pickTemplate(this.value)">${tmplOpts}</select>
        <div class="time-row">
          <label>Start <input type="time" value="${startTime}"
            onchange="_dm.startTime=this.value;_renderDayModal()"></label>
          <label>End <input type="time" value="${endTime}"
            onchange="_dm.endTime=this.value;_renderDayModal()"></label>
        </div>
        <div class="section-label">Assign Members</div>
        ${memberGroups || '<p class="empty-hint">No members — add them in ⚙ Settings.</p>'}
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button class="btn btn-primary" onclick="_saveShift()">
            ${_dm.editId?'Update Shift':'Save Shift'}
          </button>
          <button class="btn" onclick="_dm.adding=false;_dm.editId=null;_renderDayModal()">Cancel</button>
        </div>
      </div>`;
    }

    function _pickTemplate(tid) {
      _dm.templateId = tid;
      const t = state.shiftTemplates.find(t => t.id === tid);
      if (t) { _dm.startTime = t.startTime; _dm.endTime = t.endTime; }
      _renderDayModal();
    }

    function _toggleMember(mid, checked) {
      if (checked) { if (!_dm.assignments.includes(mid)) _dm.assignments.push(mid); }
      else { _dm.assignments = _dm.assignments.filter(id => id !== mid); }
    }

    function _editShift(shiftId) {
      const s = (state.schedule[_dm.dateStr] || []).find(s => s.id === shiftId);
      if (!s) return;
      _dm.editId = shiftId; _dm.adding = false;
      _dm.templateId = s.templateId || ''; _dm.startTime = s.startTime;
      _dm.endTime = s.endTime; _dm.assignments = [...s.assignments];
      _renderDayModal();
    }

    function _removeShift(shiftId) {
      if (!confirm('Remove this shift?')) return;
      state.schedule[_dm.dateStr] = (state.schedule[_dm.dateStr] || []).filter(s => s.id !== shiftId);
      saveState(); _renderDayModal(); render();
    }

    function _saveShift() {
      const { dateStr, editId, templateId, startTime, endTime, assignments } = _dm;
      if (!startTime || !endTime) return;
      if (!state.schedule[dateStr]) state.schedule[dateStr] = [];
      if (editId) {
        const s = state.schedule[dateStr].find(s => s.id === editId);
        if (s) Object.assign(s, { templateId: templateId||null, startTime, endTime, assignments, isAdHoc: !templateId });
      } else {
        state.schedule[dateStr].push({ id: generateId(), templateId: templateId||null, startTime, endTime, assignments, isAdHoc: !templateId });
      }
      saveState();
      _dm.adding = false; _dm.editId = null; _dm.assignments = [];
      _renderDayModal(); render();
    }
    let _am = null;  // appointment modal transient state

    function renderConflictsPanel() {
      const panel = document.getElementById('conflicts-panel');
      if (!panel) return;
      if (!_conflictsPanelOpen) { panel.classList.remove('open'); panel.innerHTML = ''; return; }
      panel.classList.add('open');
      const { viewYear, viewMonth } = state.settings;
      const conflicts = detectConflicts(state);
      const monthLabel = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

      const headerEl = document.createElement('div');
      headerEl.className = 'cp-header';
      const title = document.createElement('strong');
      title.textContent = `⚠ Conflicts — ${monthLabel}${conflicts.length?` (${conflicts.length})`:''}`;
      const closeBtn = document.createElement('button');
      closeBtn.className = 'modal-close';
      closeBtn.textContent = '✕';
      closeBtn.onclick = toggleConflictsPanel;
      headerEl.appendChild(title);
      headerEl.appendChild(closeBtn);

      if (!conflicts.length) {
        const inner = document.createElement('div');
        inner.className = 'cp-inner';
        inner.appendChild(headerEl);
        const msg = document.createElement('div');
        msg.className = 'no-conflicts-msg';
        msg.textContent = '✓ No conflicts this month';
        inner.appendChild(msg);
        panel.innerHTML = '';
        panel.appendChild(inner);
        return;
      }

      const cards = conflicts.map(c => {
        const member = state.members.find(m => m.id === c.memberId);
        const shift = (state.schedule[c.dateStr]||[]).find(s => s.id === c.shiftId);
        const appt = (state.appointments[c.memberId]||[]).find(a => a.id === c.apptId);
        if (!member || !shift || !appt) return null;
        const swaps = getAvailableSwaps(state, c.dateStr, c.shiftId, c.memberId);
        const dateLabel = new Date(c.dateStr+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});

        const card = document.createElement('div');
        card.className = 'conflict-card';

        const dateDiv = document.createElement('div');
        dateDiv.className = 'conflict-date';
        dateDiv.textContent = `${dateLabel} · ${formatTime(shift.startTime)}–${formatTime(shift.endTime)}`;

        const whoDiv = document.createElement('div');
        whoDiv.className = 'conflict-who';
        const dot = document.createElement('span');
        dot.className = 'member-dot';
        dot.style.background = member.color;
        const nameSpan = document.createElement('span');
        nameSpan.textContent = member.name;
        whoDiv.appendChild(dot);
        whoDiv.appendChild(nameSpan);

        const noteDiv = document.createElement('div');
        noteDiv.className = 'conflict-appt-note';
        noteDiv.textContent = `📅 ${appt.note}${!appt.allDay?' · '+formatTime(appt.startTime)+'–'+formatTime(appt.endTime):' (all day)'}`;

        card.appendChild(dateDiv);
        card.appendChild(whoDiv);
        card.appendChild(noteDiv);

        if (swaps.length) {
          const sel = document.createElement('select');
          sel.className = 'swap-select';
          const defaultOpt = document.createElement('option');
          defaultOpt.value = '';
          defaultOpt.textContent = '— Assign swap member —';
          sel.appendChild(defaultOpt);
          swaps.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.name;
            sel.appendChild(opt);
          });
          sel.onchange = () => _applySwap(c.dateStr, c.shiftId, c.memberId, sel.value);
          card.appendChild(sel);
        } else {
          const noSwap = document.createElement('span');
          noSwap.style.cssText = 'color:var(--text-muted);font-size:12px;';
          noSwap.textContent = 'No available same-role swaps';
          card.appendChild(noSwap);
        }

        return card;
      }).filter(Boolean);

      const inner = document.createElement('div');
      inner.className = 'cp-inner';
      inner.appendChild(headerEl);
      cards.forEach(c => inner.appendChild(c));
      panel.innerHTML = '';
      panel.appendChild(inner);
    }

    function _applySwap(dateStr, shiftId, conflictedMemberId, newMemberId) {
      if (!newMemberId) return;
      const shift = (state.schedule[dateStr]||[]).find(s => s.id === shiftId);
      if (!shift) return;
      shift.assignments = shift.assignments.map(id => id === conflictedMemberId ? newMemberId : id);
      saveState(); render(); renderConflictsPanel();
    }

    function openApptModal(dateStr) {
      _am = { dateStr, memberId: state.members[0]?.id||'', startTime:'09:00', endTime:'10:00', allDay:false, note:'' };
      _renderApptModal();
    }

    function _renderApptModal() {
      const { dateStr, memberId, startTime, endTime, allDay, note } = _am;
      const dateLabel = new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US',
        { weekday:'long', month:'long', day:'numeric' });

      const existing = state.members.flatMap(m =>
        (state.appointments[m.id]||[]).filter(a=>a.date===dateStr).map(a=>({m,a})));
      const existingRows = existing.map(({m,a}) => `
        <div class="shift-edit-row">
          <span class="member-dot" style="background:${m.color}"></span>
          <div class="shift-edit-info">
            <div class="shift-edit-time">${escapeHtml(m.name)}</div>
            <div class="shift-edit-sub">${escapeHtml(a.note)} · ${a.allDay?'All day':formatTime(a.startTime)+'–'+formatTime(a.endTime)}</div>
          </div>
          <button class="btn btn-danger" onclick="_removeAppt('${m.id}','${a.id}')">✕</button>
        </div>`).join('');

      const memberOpts = state.members.map(m =>
        `<option value="${m.id}"${memberId===m.id?' selected':''}>${escapeHtml(m.name)}</option>`).join('');

      document.getElementById('modal-overlay').innerHTML = `
        <div class="modal modal-lg">
          <div class="modal-header">
            <h2>📅 ${dateLabel}</h2>
            <button class="modal-close" onclick="closeModal()">✕</button>
          </div>
          <div class="modal-body">
            ${existingRows}
            <div class="${existing.length?'form-divider':''}">
              <div class="section-label">Add Appointment / Alibi</div>
              <div style="display:flex;flex-direction:column;gap:8px;">
                <select class="tmpl-select" onchange="_am.memberId=this.value">${memberOpts}</select>
                <input placeholder="Note — e.g. Doctor appointment, PTO, Training"
                  value="${escapeHtml(note)}" style="background:var(--surface);border:1px solid var(--border);
                  border-radius:var(--radius);color:var(--text);padding:6px 8px;font-size:13px;"
                  oninput="_am.note=this.value">
                <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                  <input type="checkbox" ${allDay?'checked':''}
                    onchange="_am.allDay=this.checked;_renderApptModal()"
                    style="width:15px;height:15px;accent-color:var(--accent);">
                  All day
                </label>
                ${!allDay ? `<div class="time-row">
                  <label>Start <input type="time" value="${startTime}"
                    onchange="_am.startTime=this.value"></label>
                  <label>End <input type="time" value="${endTime}"
                    onchange="_am.endTime=this.value"></label>
                </div>` : ''}
                <button class="btn btn-primary" onclick="_saveAppt()">Add Appointment</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    function _removeAppt(memberId, apptId) {
      state.appointments[memberId] = (state.appointments[memberId]||[]).filter(a=>a.id!==apptId);
      saveState(); _renderApptModal(); render();
    }

    function _saveAppt() {
      const { dateStr, memberId, startTime, endTime, allDay, note } = _am;
      if (!memberId || !note.trim()) return;
      if (!state.appointments[memberId]) state.appointments[memberId] = [];
      state.appointments[memberId].push({
        id: generateId(), date: dateStr,
        startTime: allDay?'':startTime, endTime: allDay?'':endTime,
        allDay, note: note.trim()
      });
      saveState(); _renderApptModal(); render();
    }
    function openMemberSchedule(memberId) {
      const member = state.members.find(m => m.id === memberId);
      if (!member) return;
      const { viewYear, viewMonth } = state.settings;
      const days = getDaysInMonth(viewYear, viewMonth);
      const role = state.roles.find(r => r.id === member.roleId);
      const shifts = [];
      for (let d = 1; d <= days; d++) {
        const dateStr = isoDate(viewYear, viewMonth, d);
        (state.schedule[dateStr]||[]).forEach(s => {
          if (s.assignments.includes(memberId)) shifts.push({ dateStr, s });
        });
      }
      const rows = shifts.length
        ? shifts.map(({ dateStr, s }) => {
            const dl = new Date(dateStr+'T12:00:00').toLocaleDateString('en-US',
              { weekday:'short', month:'short', day:'numeric' });
            const tmpl = s.templateId ? (state.shiftTemplates.find(t=>t.id===s.templateId)?.name||'Custom') : 'Custom';
            return `<div class="shift-edit-row">
              <div class="shift-edit-info">
                <div class="shift-edit-time">${dl}</div>
                <div class="shift-edit-sub">${formatTime(s.startTime)}–${formatTime(s.endTime)} · ${escapeHtml(tmpl)}</div>
              </div>
            </div>`;
          }).join('')
        : '<p class="empty-hint">No shifts scheduled this month.</p>';

      document.getElementById('modal-overlay').innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h2 style="display:flex;align-items:center;gap:8px;">
              <span class="member-dot" style="background:${member.color};width:14px;height:14px;"></span>
              ${escapeHtml(member.name)} — ${MONTH_NAMES[viewMonth]}
            </h2>
            <button class="modal-close" onclick="closeModal()">✕</button>
          </div>
          <div class="modal-body">
            <p style="color:var(--text-muted);font-size:12px;margin-bottom:12px;">
              Role: ${escapeHtml(role?.name||'—')} · ${shifts.length} shift${shifts.length!==1?'s':''} this month
            </p>
            ${rows}
          </div>
        </div>`;
    }
    function openCopyMenu(event, dateStr) {
      event.preventDefault();
      document.querySelectorAll('.ctx-menu').forEach(el => el.remove());
      const menu = document.createElement('div');
      menu.className = 'ctx-menu';
      menu.style.top = event.clientY + 'px';
      menu.style.left = event.clientX + 'px';
      const item1 = document.createElement('div');
      item1.className = 'ctx-item';
      item1.textContent = 'Copy shifts to next day';
      item1.onclick = () => { _copyShifts(dateStr, 1); menu.remove(); };
      const item2 = document.createElement('div');
      item2.className = 'ctx-item';
      item2.textContent = 'Copy shifts to next week';
      item2.onclick = () => { _copyShifts(dateStr, 7); menu.remove(); };
      menu.appendChild(item1);
      menu.appendChild(item2);
      document.body.appendChild(menu);
      setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 0);
    }

    function _copyShifts(dateStr, daysAhead) {
      const src = state.schedule[dateStr];
      if (!src || !src.length) return;
      const d = new Date(dateStr + 'T12:00:00');
      d.setDate(d.getDate() + daysAhead);
      const target = isoDate(d.getFullYear(), d.getMonth(), d.getDate());
      if (!state.schedule[target]) state.schedule[target] = [];
      src.forEach(s => state.schedule[target].push({ ...s, id: generateId() }));
      saveState(); render();
    }

    // ── Settings Modal ────────────────────────────────────────────
    let _settingsTab = 'roles';

    function openSettings(tab) {
      if (tab) _settingsTab = tab;
      if (!state.roles.length && _settingsTab !== 'roles') _settingsTab = 'roles';
      document.getElementById('modal-overlay').innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h2>⚙ Settings</h2>
            <button class="modal-close" onclick="closeModal()">✕</button>
          </div>
          <div class="modal-body">
            <div class="tabs">
              <button class="tab${_settingsTab==='roles'?' active':''}" onclick="openSettings('roles')">Roles</button>
              <button class="tab${_settingsTab==='members'?' active':''}" onclick="openSettings('members')">Members</button>
              <button class="tab${_settingsTab==='templates'?' active':''}" onclick="openSettings('templates')">Shift Templates</button>
            </div>
            ${_settingsTab==='roles' ? renderRolesTab() : ''}
            ${_settingsTab==='members' ? renderMembersTab() : ''}
            ${_settingsTab==='templates' ? renderTemplatesTab() : ''}
          </div>
        </div>`;
    }

    // ── Roles tab ─────────────────────────────────────────────────────
    function renderRolesTab() {
      const rows = state.roles.map(r => `
        <div class="item-row">
          <span class="row-name">${escapeHtml(r.name)}</span>
          <button class="btn btn-danger" onclick="deleteRole('${r.id}')">Delete</button>
        </div>`).join('');
      return `
        <div class="item-list">${rows||'<p class="empty-hint">No roles yet. Add one below.</p>'}</div>
        <div class="add-form">
          <input id="new-role-name" placeholder="Role name (e.g. Nurse)"
            onkeydown="if(event.key==='Enter')addRole()">
          <button class="btn btn-primary" onclick="addRole()">Add Role</button>
        </div>`;
    }

    function addRole() {
      const el = document.getElementById('new-role-name');
      const name = el.value.trim();
      if (!name) return;
      state.roles.push({ id: generateId(), name });
      saveState(); openSettings('roles');
    }

    function deleteRole(id) {
      if (state.members.some(m => m.roleId === id) &&
          !confirm('Members are assigned to this role. Delete role anyway?')) return;
      state.roles = state.roles.filter(r => r.id !== id);
      saveState(); openSettings('roles');
    }

    // ── Members tab ───────────────────────────────────────────────────
    function renderMembersTab() {
      if (!state.roles.length) return `<p style="color:var(--warn);font-size:13px;">
        Create at least one Role first (Roles tab), then add members.</p>`;
      const rows = state.members.map(m => {
        const role = state.roles.find(r => r.id === m.roleId);
        return `<div class="item-row">
          <span class="color-dot" style="background:${m.color}"></span>
          <span class="row-name">${escapeHtml(m.name)}
            <span style="color:var(--text-muted);font-size:12px;">${escapeHtml(role?.name||'—')}</span>
          </span>
          <input type="color" class="color-swatch" value="${m.color}" style="background:${m.color}"
            oninput="updateMemberColor('${m.id}',this.value)">
          <button class="btn btn-danger" onclick="deleteMember('${m.id}')">✕</button>
        </div>`;
      }).join('');
      const roleOpts = state.roles.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
      return `
        <div class="item-list">${rows||'<p class="empty-hint">No members yet.</p>'}</div>
        <div class="add-form">
          <input id="new-member-name" placeholder="Full name"
            onkeydown="if(event.key==='Enter')addMember()">
          <select id="new-member-role">${roleOpts}</select>
          <button class="btn btn-primary" onclick="addMember()">Add Member</button>
        </div>`;
    }

    function addMember() {
      const nameEl = document.getElementById('new-member-name');
      const roleEl = document.getElementById('new-member-role');
      const name = nameEl.value.trim();
      const roleId = roleEl?.value;
      if (!name || !roleId) return;
      state.members.push({ id: generateId(), name, roleId, color: getNextColor(state.members) });
      saveState(); openSettings('members');
    }

    function updateMemberColor(id, color) {
      const m = state.members.find(m => m.id === id);
      if (m) { m.color = color; saveState(); openSettings('members'); }
    }

    function deleteMember(id) {
      const inShifts = Object.values(state.schedule).some(shifts =>
        shifts.some(s => s.assignments.includes(id)));
      if (inShifts && !confirm('Member has assigned shifts. Delete anyway?')) return;
      state.members = state.members.filter(m => m.id !== id);
      Object.values(state.schedule).forEach(shifts =>
        shifts.forEach(s => { s.assignments = s.assignments.filter(a => a !== id); }));
      delete state.appointments[id];
      saveState(); openSettings('members'); render();
    }

    // ── Templates tab ─────────────────────────────────────────────────
    function renderTemplatesTab() {
      const rows = state.shiftTemplates.map(t => `
        <div class="item-row">
          <span class="row-name">${escapeHtml(t.name)}</span>
          <span style="color:var(--text-muted);font-size:12px;">${formatTime(t.startTime)}–${formatTime(t.endTime)}</span>
          <button class="btn btn-danger" onclick="deleteTemplate('${t.id}')">✕</button>
        </div>`).join('');
      return `
        <div class="item-list">${rows||'<p class="empty-hint">No templates yet.</p>'}</div>
        <div class="add-form">
          <input id="tmpl-name" placeholder="Name (e.g. Morning)" style="min-width:110px;">
          <input id="tmpl-start" type="time" value="06:00">
          <span style="color:var(--text-muted);font-size:13px;">to</span>
          <input id="tmpl-end" type="time" value="14:00">
          <button class="btn btn-primary" onclick="addTemplate()">Add</button>
        </div>`;
    }

    function addTemplate() {
      const name = document.getElementById('tmpl-name').value.trim();
      const startTime = document.getElementById('tmpl-start').value;
      const endTime = document.getElementById('tmpl-end').value;
      if (!name || !startTime || !endTime) return;
      state.shiftTemplates.push({ id: generateId(), name, startTime, endTime });
      saveState(); openSettings('templates'); render();
    }

    function deleteTemplate(id) {
      const inUse = Object.values(state.schedule).some(shifts =>
        shifts.some(s => s.templateId === id));
      if (inUse) {
        if (!confirm('This template is used in the schedule. Delete it? Existing shifts will become ad-hoc.')) return;
        Object.values(state.schedule).forEach(shifts =>
          shifts.forEach(s => { if (s.templateId === id) { s.templateId = null; s.isAdHoc = true; } }));
      }
      state.shiftTemplates = state.shiftTemplates.filter(t => t.id !== id);
      saveState(); openSettings('templates'); render();
    }

    // ── Modal helpers ─────────────────────────────────────────────────
    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      if (overlay) overlay.innerHTML = '';
    }

    // ── Keyboard shortcuts ────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeModal(); }
      const modalOpen = document.getElementById('modal-overlay')?.children.length > 0;
      if (!modalOpen) {
        if (e.key === 'ArrowLeft') prevMonth();
        if (e.key === 'ArrowRight') nextMonth();
      }
    });

    // ── Init ──────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      await loadState();
      state._apptMode = false;  // transient UI flag, never persisted
      render();
      document.getElementById('app').addEventListener('click', e => {
        // Member chip click → open member schedule
        const chip = e.target.closest('.member-chip');
        if (chip) {
          e.stopPropagation();
          openMemberSchedule(chip.dataset.memberId);
          return;
        }
        // Day cell click → open day/appointment modal
        const cell = e.target.closest('.day-cell:not(.outside)');
        if (cell && !e.target.closest('.shift-bar button')) {
          const dateStr = cell.dataset.date;
          if (dateStr) {
            if (state._apptMode) openApptModal(dateStr);
            else openDayModal(dateStr);
          }
        }
      });
    });

    // ── Tour ──────────────────────────────────────────────────────────
    const TOUR_STEPS = [
      {
        title: 'Welcome to Shift Calendar!',
        text: 'This quick tour walks you through the key features. Use Next / Back to navigate, or press Escape to exit at any time.',
        target: null, position: 'center'
      },
      {
        title: '⚙ Settings — Start Here',
        text: 'Before building a schedule, click Settings to create your Roles (e.g. Nurse, Technician), add up to 30+ Members with auto-assigned colors, and define reusable Shift Templates like Morning (6am–2pm) and Evening (2pm–10pm).',
        target: 'tour-settings-btn', position: 'bottom'
      },
      {
        title: 'Navigate Months',
        text: 'Use the ◄ ► arrows to move between months, or press the ← → keyboard arrow keys. Click Today to jump back to the current month. Each month\'s data is stored independently.',
        target: 'tour-month-nav', position: 'bottom'
      },
      {
        title: 'Add Shifts to a Day',
        text: 'Click any day cell to open the Day Editor. Pick a shift template (which pre-fills the times) or set custom times, then check off which members to assign. Members already on an overlapping shift that day are shown as busy.',
        target: 'tour-days-grid', position: 'top'
      },
      {
        title: 'Copy Shifts Quickly',
        text: 'Right-click any day cell to copy all its shifts forward. "Copy to next day" duplicates them by one day; "Copy to next week" copies to the same weekday next week — great for building a repeating schedule fast.',
        target: 'tour-days-grid', position: 'top'
      },
      {
        title: '👁 Appointment Overlay',
        text: 'Click Appointments to switch the entire calendar into appointment mode. Click any day to record a member\'s unavailability — doctor appointments, PTO, training. The calendar detects conflicts with their scheduled shifts automatically.',
        target: 'tour-appt-btn', position: 'bottom'
      },
      {
        title: '⚠ Conflicts Dashboard',
        text: 'When a member has an appointment that overlaps a shift, the ⚠ badge shows the conflict count. Click it to open the Conflicts panel — it lists every conflict this month and offers a swap dropdown showing available same-role members who are free.',
        target: 'tour-conflicts-btn', position: 'bottom'
      },
      {
        title: 'Member Schedule View',
        text: 'Click any member\'s name chip inside a shift bar to see their full monthly schedule — a read-only list of every shift they\'re assigned to this month, including dates, times, and template names.',
        target: 'tour-days-grid', position: 'top'
      },
      {
        title: 'Coverage Summary',
        text: 'The footer tracks how many days each shift template is covered this month (e.g. Morning: 18/30). Green means fully covered; amber means there are days with no one assigned to that shift.',
        target: 'tour-coverage-footer', position: 'top'
      },
      {
        title: '🖨 Print the Calendar',
        text: 'Click the print button to produce a full-screen landscape printout of the calendar — shift bar colors preserved, all controls hidden. Great for posting on a notice board or sharing offline.',
        target: 'tour-print-btn', position: 'bottom'
      },
      {
        title: 'You\'re all set! 🗓',
        text: 'Your schedule saves automatically to this browser. There\'s nothing to install or upload — just open index.html and start scheduling. Click the ? Tour button any time to revisit this walkthrough.',
        target: null, position: 'center'
      }
    ];

    let _tourStep = -1;
    let _tourSpotlight = null;
    let _tourCard = null;

    function startTour() {
      closeModal();
      _tourStep = 0;
      _renderTourStep();
    }

    function _renderTourStep() {
      _clearTourElements();
      const step = TOUR_STEPS[_tourStep];
      if (!step) { endTour(); return; }

      // Spotlight
      const target = step.target ? document.getElementById(step.target) : null;
      if (target) {
        const r = target.getBoundingClientRect();
        const pad = 6;
        _tourSpotlight = document.createElement('div');
        _tourSpotlight.className = 'tour-spotlight';
        _tourSpotlight.style.top    = (r.top    - pad) + 'px';
        _tourSpotlight.style.left   = (r.left   - pad) + 'px';
        _tourSpotlight.style.width  = (r.width  + pad * 2) + 'px';
        _tourSpotlight.style.height = (r.height + pad * 2) + 'px';
        document.body.appendChild(_tourSpotlight);
      } else {
        // Dim whole screen without a spotlight hole
        _tourSpotlight = document.createElement('div');
        _tourSpotlight.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:10001;pointer-events:none;';
        document.body.appendChild(_tourSpotlight);
      }

      // Card
      _tourCard = document.createElement('div');
      _tourCard.className = 'tour-card';

      const dots = document.createElement('div');
      dots.className = 'tour-dots';
      TOUR_STEPS.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'tour-dot' + (i === _tourStep ? ' active' : '');
        dots.appendChild(d);
      });

      const h3 = document.createElement('h3');
      h3.textContent = step.title;

      const p = document.createElement('p');
      p.textContent = step.text;

      const controls = document.createElement('div');
      controls.className = 'tour-controls';

      const stepCount = document.createElement('span');
      stepCount.className = 'step-count';
      stepCount.textContent = `${_tourStep + 1} / ${TOUR_STEPS.length}`;

      if (_tourStep > 0) {
        const back = document.createElement('button');
        back.className = 'btn';
        back.textContent = '← Back';
        back.onclick = () => { _tourStep--; _renderTourStep(); };
        controls.appendChild(stepCount);
        controls.appendChild(back);
      } else {
        controls.appendChild(stepCount);
      }

      const isLast = _tourStep === TOUR_STEPS.length - 1;
      const next = document.createElement('button');
      next.className = 'btn btn-primary';
      next.textContent = isLast ? 'Done' : 'Next →';
      next.onclick = () => { if (isLast) endTour(); else { _tourStep++; _renderTourStep(); } };

      const skip = document.createElement('button');
      skip.className = 'btn';
      skip.style.color = 'var(--text-muted)';
      skip.textContent = 'Skip';
      skip.onclick = endTour;

      controls.appendChild(next);
      if (!isLast) controls.appendChild(skip);

      _tourCard.appendChild(dots);
      _tourCard.appendChild(h3);
      _tourCard.appendChild(p);
      _tourCard.appendChild(controls);
      document.body.appendChild(_tourCard);
      _positionTourCard(target, step.position);
    }

    function _positionTourCard(target, position) {
      const cw = _tourCard.offsetWidth, ch = _tourCard.offsetHeight;
      const vw = window.innerWidth, vh = window.innerHeight;
      const margin = 14;
      let top, left;

      if (!target || position === 'center') {
        top  = (vh - ch) / 2;
        left = (vw - cw) / 2;
      } else {
        const r = target.getBoundingClientRect();
        if (position === 'bottom') {
          top  = r.bottom + margin;
          left = r.left + (r.width - cw) / 2;
        } else if (position === 'top') {
          top  = r.top - ch - margin;
          left = r.left + (r.width - cw) / 2;
        } else if (position === 'right') {
          top  = r.top + (r.height - ch) / 2;
          left = r.right + margin;
        } else {
          top  = r.top + (r.height - ch) / 2;
          left = r.left - cw - margin;
        }
        // Clamp to viewport
        top  = Math.max(margin, Math.min(top,  vh - ch - margin));
        left = Math.max(margin, Math.min(left, vw - cw - margin));
      }
      _tourCard.style.top  = top  + 'px';
      _tourCard.style.left = left + 'px';
    }

    function _clearTourElements() {
      if (_tourSpotlight) { _tourSpotlight.remove(); _tourSpotlight = null; }
      if (_tourCard)      { _tourCard.remove();      _tourCard = null; }
    }

    function endTour() {
      _clearTourElements();
      _tourStep = -1;
    }

    // Allow Escape to exit tour
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && _tourStep >= 0) endTour();
    }, true);
    </script>
</body>
</html>
