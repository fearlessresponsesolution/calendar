<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shift Calendar — Unit Tests</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #0f172a; color: #e2e8f0; }
    .pass { color: #10b981; } .fail { color: #ef4444; }
    h2 { color: #94a3b8; margin: 16px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
    #summary { font-size: 15px; margin-bottom: 16px; }
  </style>
</head>
<body>
<h1 style="margin-bottom:8px;">Unit Tests</h1>
<div id="summary"></div>
<div id="results"></div>
<script>
  const results = [];
  function test(name, fn) {
    try { fn(); results.push({ name, ok: true }); }
    catch(e) { results.push({ name, ok: false, err: e.message }); }
  }
  function assert(cond, msg) {
    if (!cond) throw new Error(msg || 'assertion failed');
  }
  function assertEqual(a, b) {
    if (a !== b) throw new Error(`expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
  }

  // ── Functions under test ─────────────────────────────────────────
  // NOTE: Functions below are intentionally duplicated from index.html.
  // The app runs from file:// with no module system, so sharing via import is not possible.
  // Keep these in sync manually when index.html utility functions change.

  const COLOR_PALETTE = [
    '#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6',
    '#06b6d4','#84cc16','#f97316','#ec4899','#14b8a6',
    '#6366f1','#a3e635','#fb923c','#e879f9','#22d3ee',
    '#4ade80','#fbbf24','#f43f5e','#818cf8','#34d399'
  ];

  function timeToMinutes(t) {
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  }

  function rangesOverlap(s1, e1, s2, e2) {
    let start1 = timeToMinutes(s1), end1 = timeToMinutes(e1);
    let start2 = timeToMinutes(s2), end2 = timeToMinutes(e2);
    if (end1 <= start1) end1 += 1440;  // midnight-spanning
    if (end2 <= start2) end2 += 1440;
    if (end1 > 1440 && start2 < start1) { start2 += 1440; end2 += 1440; }
    return start1 < end2 && start2 < end1;
  }

  function getNextColor(members) {
    return COLOR_PALETTE[members.length % COLOR_PALETTE.length];
  }

  function getDaysInMonth(year, month) {
    return new Date(year, month + 1, 0).getDate();
  }

  function isoDate(year, month, day) {
    return `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }

  function formatTime(t) {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    return `${h % 12 || 12}:${String(m).padStart(2,'0')}${h >= 12 ? 'pm' : 'am'}`;
  }

  function detectConflicts(st) {
    const { viewYear, viewMonth } = st.settings;
    const days = getDaysInMonth(viewYear, viewMonth);
    const conflicts = [];
    for (let d = 1; d <= days; d++) {
      const dateStr = isoDate(viewYear, viewMonth, d);
      for (const shift of (st.schedule[dateStr] || [])) {
        for (const memberId of shift.assignments) {
          for (const appt of (st.appointments[memberId] || []).filter(a => a.date === dateStr)) {
            const conflict = appt.allDay ||
              rangesOverlap(shift.startTime, shift.endTime, appt.startTime, appt.endTime);
            if (conflict) conflicts.push({ dateStr, shiftId: shift.id, memberId, apptId: appt.id });
          }
        }
      }
    }
    return conflicts;
  }

  function getAvailableSwaps(st, dateStr, shiftId, conflictedMemberId) {
    const shift = (st.schedule[dateStr] || []).find(s => s.id === shiftId);
    if (!shift) return [];
    const conflicted = st.members.find(m => m.id === conflictedMemberId);
    if (!conflicted) return [];
    const dayShifts = st.schedule[dateStr] || [];
    return st.members.filter(m => {
      if (m.id === conflictedMemberId) return false;
      if (m.roleId !== conflicted.roleId) return false;
      if (dayShifts.some(s => s.id !== shiftId && s.assignments.includes(m.id) &&
          rangesOverlap(shift.startTime, shift.endTime, s.startTime, s.endTime))) return false;
      if ((st.appointments[m.id] || []).some(a => a.date === dateStr &&
          (a.allDay || rangesOverlap(shift.startTime, shift.endTime, a.startTime, a.endTime)))) return false;
      return true;
    });
  }

  // ── Tests ─────────────────────────────────────────────────────────
  // timeToMinutes
  test('timeToMinutes: 06:00 → 360', () => assertEqual(timeToMinutes('06:00'), 360));
  test('timeToMinutes: 22:30 → 1350', () => assertEqual(timeToMinutes('22:30'), 1350));
  test('timeToMinutes: 00:00 → 0', () => assertEqual(timeToMinutes('00:00'), 0));

  // rangesOverlap
  test('overlap: clear overlap', () => assert(rangesOverlap('06:00','14:00','08:00','10:00')));
  test('overlap: adjacent ranges do not overlap', () => assert(!rangesOverlap('06:00','14:00','14:00','22:00')));
  test('overlap: fully before', () => assert(!rangesOverlap('06:00','14:00','15:00','22:00')));
  test('overlap: fully after', () => assert(!rangesOverlap('15:00','22:00','06:00','14:00')));
  test('overlap: midnight-spanning overlaps early morning appt', () => assert(rangesOverlap('22:00','06:00','05:00','07:00')));
  test('overlap: midnight-spanning does NOT overlap midday', () => assert(!rangesOverlap('22:00','06:00','10:00','12:00')));
  test('overlap: midnight-spanning overlaps late night', () => assert(rangesOverlap('22:00','06:00','23:00','23:30')));

  // getNextColor
  test('getNextColor: no members → first color', () => assertEqual(getNextColor([]), '#3b82f6'));
  test('getNextColor: 1 member → second color', () => assertEqual(getNextColor([{}]), '#10b981'));
  test('getNextColor: 20 members → wraps to first', () => {
    assertEqual(getNextColor(Array.from({length:20})), '#3b82f6');
  });

  // getDaysInMonth
  test('getDaysInMonth: June 2026 → 30', () => assertEqual(getDaysInMonth(2026, 5), 30));
  test('getDaysInMonth: Feb 2024 (leap) → 29', () => assertEqual(getDaysInMonth(2024, 1), 29));
  test('getDaysInMonth: Feb 2025 → 28', () => assertEqual(getDaysInMonth(2025, 1), 28));

  // isoDate
  test('isoDate: pads month and day', () => assertEqual(isoDate(2026, 5, 3), '2026-06-03'));

  // formatTime
  test('formatTime: midnight → 12:00am', () => assertEqual(formatTime('00:00'), '12:00am'));
  test('formatTime: noon → 12:00pm', () => assertEqual(formatTime('12:00'), '12:00pm'));
  test('formatTime: 06:00 → 6:00am', () => assertEqual(formatTime('06:00'), '6:00am'));
  test('formatTime: 14:00 → 2:00pm', () => assertEqual(formatTime('14:00'), '2:00pm'));
  test('formatTime: 22:30 → 10:30pm', () => assertEqual(formatTime('22:30'), '10:30pm'));
  test('formatTime: empty string → empty string', () => assertEqual(formatTime(''), ''));

  // detectConflicts
  test('detectConflicts: no conflicts when schedule empty', () => {
    const s = { members:[], roles:[], shiftTemplates:[], schedule:{}, appointments:{},
                settings:{ viewYear:2026, viewMonth:5 } };
    assertEqual(detectConflicts(s).length, 0);
  });

  test('detectConflicts: all-day appointment conflicts any shift', () => {
    const s = {
      members:[{ id:'m1', roleId:'r1', name:'Alice', color:'#3b82f6' }],
      roles:[], shiftTemplates:[],
      schedule:{ '2026-06-01':[{ id:'s1', startTime:'06:00', endTime:'14:00', assignments:['m1'], templateId:null, isAdHoc:false }] },
      appointments:{ 'm1':[{ id:'a1', date:'2026-06-01', allDay:true, startTime:'', endTime:'', note:'PTO' }] },
      settings:{ viewYear:2026, viewMonth:5 }
    };
    const c = detectConflicts(s);
    assertEqual(c.length, 1);
    assertEqual(c[0].memberId, 'm1');
  });

  test('detectConflicts: timed appointment outside shift hours → no conflict', () => {
    const s = {
      members:[{ id:'m1', roleId:'r1', name:'Alice', color:'#3b82f6' }],
      roles:[], shiftTemplates:[],
      schedule:{ '2026-06-01':[{ id:'s1', startTime:'06:00', endTime:'14:00', assignments:['m1'], templateId:null, isAdHoc:false }] },
      appointments:{ 'm1':[{ id:'a1', date:'2026-06-01', allDay:false, startTime:'15:00', endTime:'16:00', note:'Dentist' }] },
      settings:{ viewYear:2026, viewMonth:5 }
    };
    assertEqual(detectConflicts(s).length, 0);
  });

  test('detectConflicts: timed appointment overlapping shift → conflict', () => {
    const s = {
      members:[{ id:'m1', roleId:'r1', name:'Alice', color:'#3b82f6' }],
      roles:[], shiftTemplates:[],
      schedule:{ '2026-06-01':[{ id:'s1', startTime:'06:00', endTime:'14:00', assignments:['m1'], templateId:null, isAdHoc:false }] },
      appointments:{ 'm1':[{ id:'a1', date:'2026-06-01', allDay:false, startTime:'09:00', endTime:'11:00', note:'Dr. appt' }] },
      settings:{ viewYear:2026, viewMonth:5 }
    };
    const c = detectConflicts(s);
    assertEqual(c.length, 1);
  });

  // getAvailableSwaps
  test('getAvailableSwaps: returns same-role member with no conflicts', () => {
    const s = {
      members:[
        { id:'m1', roleId:'r1', name:'Alice', color:'#3b82f6' },
        { id:'m2', roleId:'r1', name:'Bob', color:'#10b981' }
      ],
      roles:[{ id:'r1', name:'Nurse' }], shiftTemplates:[],
      schedule:{ '2026-06-01':[{ id:'s1', startTime:'06:00', endTime:'14:00', assignments:['m1'], templateId:null, isAdHoc:false }] },
      appointments:{},
      settings:{ viewYear:2026, viewMonth:5 }
    };
    const swaps = getAvailableSwaps(s, '2026-06-01', 's1', 'm1');
    assertEqual(swaps.length, 1);
    assertEqual(swaps[0].id, 'm2');
  });

  test('getAvailableSwaps: excludes different-role members', () => {
    const s = {
      members:[
        { id:'m1', roleId:'r1', name:'Alice', color:'#3b82f6' },
        { id:'m2', roleId:'r2', name:'Bob', color:'#10b981' }
      ],
      roles:[{ id:'r1', name:'Nurse' },{ id:'r2', name:'Tech' }], shiftTemplates:[],
      schedule:{ '2026-06-01':[{ id:'s1', startTime:'06:00', endTime:'14:00', assignments:['m1'], templateId:null, isAdHoc:false }] },
      appointments:{},
      settings:{ viewYear:2026, viewMonth:5 }
    };
    assertEqual(getAvailableSwaps(s, '2026-06-01', 's1', 'm1').length, 0);
  });

  test('getAvailableSwaps: excludes member with appointment conflict', () => {
    const s = {
      members:[
        { id:'m1', roleId:'r1', name:'Alice', color:'#3b82f6' },
        { id:'m2', roleId:'r1', name:'Bob', color:'#10b981' }
      ],
      roles:[{ id:'r1', name:'Nurse' }], shiftTemplates:[],
      schedule:{ '2026-06-01':[{ id:'s1', startTime:'06:00', endTime:'14:00', assignments:['m1'], templateId:null, isAdHoc:false }] },
      appointments:{ 'm2':[{ id:'a1', date:'2026-06-01', allDay:true, startTime:'', endTime:'', note:'PTO' }] },
      settings:{ viewYear:2026, viewMonth:5 }
    };
    assertEqual(getAvailableSwaps(s, '2026-06-01', 's1', 'm1').length, 0);
  });

  test('getAvailableSwaps: excludes member already on overlapping shift', () => {
    const s = {
      members:[
        { id:'m1', roleId:'r1', name:'Alice', color:'#3b82f6' },
        { id:'m2', roleId:'r1', name:'Bob', color:'#10b981' }
      ],
      roles:[{ id:'r1', name:'Nurse' }], shiftTemplates:[],
      schedule:{ '2026-06-01':[
        { id:'s1', startTime:'06:00', endTime:'14:00', assignments:['m1'], templateId:null, isAdHoc:false },
        { id:'s2', startTime:'08:00', endTime:'16:00', assignments:['m2'], templateId:null, isAdHoc:false }
      ]},
      appointments:{},
      settings:{ viewYear:2026, viewMonth:5 }
    };
    assertEqual(getAvailableSwaps(s, '2026-06-01', 's1', 'm1').length, 0);
  });

  // ── Render results ────────────────────────────────────────────────
  const pass = results.filter(r => r.ok).length;
  document.getElementById('summary').innerHTML =
    `<span style="color:${pass===results.length?'#10b981':'#ef4444'}">${pass}/${results.length} passed</span>`;
  document.getElementById('results').innerHTML = results.map(r =>
    `<p class="${r.ok?'pass':'fail'}">${r.ok?'✓':'✗'} ${r.name}${r.err?' — <span style="color:#fca5a5">'+r.err+'</span>':''}</p>`
  ).join('');
</script>
</body>
</html>
